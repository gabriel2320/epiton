services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: epiton_lab
      POSTGRES_USER: tryton
      POSTGRES_PASSWORD: tryton
    ports:
      - "5433:5432"
    volumes:
      - epiton_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryton -d epiton_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  tryton:
    build: .
    image: epiton/tryton-lab:7.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOSTNAME: db
      DB_USER: tryton
      DB_PASSWORD: tryton
      DB_NAME: epiton_lab
    ports:
      - "8000:8000"
    volumes:
      - ./trytond.conf:/etc/tryton/trytond.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  gateway:
    build: ../apps/gateway
    image: epiton/gateway:0.1
    depends_on:
      tryton:
        condition: service_healthy
    environment:
      EPITON_UPSTREAM: http://tryton:8000
      EPITON_GATEWAY_BIND: 0.0.0.0:8080
      # Lab compatibility mode; trytond still enforces its own ACLs.
      EPITON_STRICT_ACL: "false"
      EPITON_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173"
      EPITON_TRUST_PROXY: "false"
      EPITON_MAX_BODY_BYTES: "16777216"
      EPITON_LOGIN_LIMIT_PER_MINUTE: "20"
      EPITON_UPSTREAM_TIMEOUT_SECS: "120"
    ports:
      - "8080:8080"

  # Test-only reference client. Never part of the Epiton runtime or production stack.
  proteus7:
    profiles: ["oracle7"]
    build:
      context: ./proteus
      args:
        PROTEUS_VERSION: 7.0.3
    image: epiton/proteus-oracle:7.0.3
    environment:
      EPITON_PROTEUS_URL: http://admin:admin@tryton:8000/epiton_lab/
      EPITON_TRYTON_SERIES: "7.0"
      EPITON_RECEIPT_DIR: /receipts
    volumes:
      - ../tests/compat/receipts:/receipts

  # Supported Tryton 8 tier: `pnpm lab:up:8` (separate database and gateway).
  db8:
    profiles: ["tryton8"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: epiton_lab8
      POSTGRES_USER: tryton
      POSTGRES_PASSWORD: tryton
    ports:
      - "5434:5432"
    volumes:
      - epiton_pg8:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryton -d epiton_lab8"]
      interval: 5s
      timeout: 5s
      retries: 10

  tryton8:
    profiles: ["tryton8"]
    build:
      context: .
      dockerfile: Dockerfile.8
    image: epiton/tryton-lab:8.0
    depends_on:
      db8:
        condition: service_healthy
    environment:
      DB_HOSTNAME: db8
      DB_USER: tryton
      DB_PASSWORD: tryton
      DB_NAME: epiton_lab8
    ports:
      - "8001:8000"
    volumes:
      - ./trytond.8.conf:/etc/tryton/trytond.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  gateway8:
    profiles: ["tryton8"]
    build: ../apps/gateway
    image: epiton/gateway:0.1
    depends_on:
      tryton8:
        condition: service_healthy
    environment:
      EPITON_UPSTREAM: http://tryton8:8000
      EPITON_GATEWAY_BIND: 0.0.0.0:8081
      # Lab compatibility mode; trytond still enforces its own ACLs.
      EPITON_STRICT_ACL: "false"
      EPITON_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173"
      EPITON_TRUST_PROXY: "false"
      EPITON_MAX_BODY_BYTES: "16777216"
      EPITON_LOGIN_LIMIT_PER_MINUTE: "20"
      EPITON_UPSTREAM_TIMEOUT_SECS: "120"
    ports:
      - "8081:8081"

  # Test-only reference client for the Tryton 8 compatibility tier.
  proteus8:
    profiles: ["oracle8"]
    build:
      context: ./proteus
      args:
        PROTEUS_VERSION: 8.0.0
    image: epiton/proteus-oracle:8.0.0
    environment:
      EPITON_PROTEUS_URL: http://admin:admin@tryton8:8000/epiton_lab8/rpc/
      EPITON_TRYTON_SERIES: "8.0"
      EPITON_RECEIPT_DIR: /receipts
    volumes:
      - ../tests/compat/receipts:/receipts

volumes:
  epiton_pg:
  epiton_pg8:
