name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:tryton-canary
      - run: pnpm check:native-artifacts
      - run: pnpm check:native-promotion
      - run: pnpm --filter @epiton/protocol build
      - run: pnpm --filter @epiton/view-engine build
      - run: pnpm --filter @epiton/intelligence build
      - run: pnpm --filter @epiton/ui build
      - run: pnpm --filter @epiton/web build
      - run: pnpm check:bundle
        env:
          EPITON_BUNDLE_LIMIT_KB: "750"
      - run: pnpm test:e2e:mock
      - name: Next production CSP and static-only PWA receipt
        run: pnpm test:e2e:next

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@v4
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/gateway
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo check --locked

  desktop:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            wget
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/desktop/src-tauri
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo check --locked
        working-directory: apps/desktop/src-tauri
      - name: Build Tauri Linux bundles
        run: pnpm --filter @epiton/desktop build:linux
      - name: Record unsigned Linux bundle receipt
        run: >-
          node scripts/native-artifact-receipt.mjs
          --kind linux-unsigned
          --output .artifacts/native/linux-unsigned/receipt.json
          apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Attest Linux bundles and receipt
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            .artifacts/native/linux-unsigned/receipt.json
            .artifacts/native/linux-unsigned/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: epiton-desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*
            apps/desktop/src-tauri/target/release/bundle/appimage/*
            .artifacts/native/linux-unsigned/receipt.json
            .artifacts/native/linux-unsigned/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true

  mobile-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Sync the Epiton static adapter into Capacitor
        run: pnpm --filter @epiton/mobile sync:android
      - name: Build Android debug APK
        run: ./gradlew assembleDebug
        working-directory: apps/mobile/android
      - name: Verify Android debug signature
        shell: bash
        run: |
          mapfile -t apksigner_candidates < <(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner -print)
          if [ "${#apksigner_candidates[@]}" -eq 0 ]; then
            echo "Android SDK did not provide apksigner"
            exit 1
          fi
          apksigner_path="${apksigner_candidates[0]}"
          if [ ! -x "$apksigner_path" ]; then
            echo "apksigner is not executable: $apksigner_path"
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs \
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Record Android debug artifact receipt
        run: >-
          node scripts/native-artifact-receipt.mjs
          --kind android-debug
          --output .artifacts/native/android-debug/receipt.json
          apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attest Android debug APK and receipt
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            .artifacts/native/android-debug/receipt.json
            .artifacts/native/android-debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: epiton-mobile-android-debug
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            .artifacts/native/android-debug/receipt.json
            .artifacts/native/android-debug/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true

  lab-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: "7.0"
            database: epiton_lab
            gateway: http://127.0.0.1:8080
            start: lab:up
            oracle: lab:oracle:7
          - series: "8.0"
            database: epiton_lab8
            gateway: http://127.0.0.1:8081
            start: lab:up:8
            oracle: lab:oracle:8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @epiton/protocol build
      - run: pnpm --filter @epiton/view-engine build
      - name: Start Tryton ${{ matrix.series }} lab
        run: pnpm ${{ matrix.start }}
      - name: Wait for Epiton gateway
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "${{ matrix.gateway }}/healthz" >/dev/null; then
              echo "gateway ready"
              exit 0
            fi
            sleep 5
          done
          echo "gateway did not become ready"
          docker compose -f docker/docker-compose.yml --profile tryton8 logs
          exit 1
      - name: Epiton live compatibility contract
        run: pnpm compat:live
        env:
          EPITON_BASE: ${{ matrix.gateway }}
          EPITON_DB: ${{ matrix.database }}
          EPITON_USER: admin
          EPITON_PASSWORD: admin
          EPITON_COMPAT_SERIES: ${{ matrix.series }}
      - name: GNU Health metadata guard on stock Tryton
        run: |
          set +e
          pnpm gh:check
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected stock Tryton GNU Health discovery to exit 2, got $status"
            exit 1
          fi
        env:
          EPITON_BASE: ${{ matrix.gateway }}
          EPITON_DB: ${{ matrix.database }}
          EPITON_USER: admin
          EPITON_PASSWORD: admin
          EPITON_GH_ENVIRONMENT_KIND: stock-tryton-${{ matrix.series }}
          EPITON_GH_RECEIPT: tests/compat/receipts/gnu-health-${{ matrix.series }}-latest.json
      - name: Proteus reference oracle
        run: pnpm ${{ matrix.oracle }}
      - name: Browser-to-Tryton disposable CRUD
        run: pnpm test:e2e:live
        env:
          VITE_EPITON_GATEWAY_URL: ${{ matrix.gateway }}
          EPITON_E2E_LAB: disposable
          EPITON_DB: ${{ matrix.database }}
          EPITON_USER: admin
          EPITON_PASSWORD: admin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-receipts-${{ matrix.series }}
          path: tests/compat/receipts/*-${{ matrix.series }}-latest.json
          if-no-files-found: warn
      - name: Lab diagnostics
        if: failure()
        run: docker compose -f docker/docker-compose.yml --profile tryton8 logs --no-color
      - name: Tear down lab
        if: always()
        run: pnpm lab:down
